<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.55" stop-color="#2a0f4d"/>
      <stop offset="1" stop-color="#0d1b3f"/>
    </linearGradient>
    <linearGradient id="funk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="0.5" stop-color="#ffc371"/>
      <stop offset="1" stop-color="#3ad0ff"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#3ad0ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1280 M0 120 H1280 M0 180 H1280 M0 240 H1280 M0 300 H1280"/>
    <path d="M80 0 V340 M240 0 V340 M400 0 V340 M560 0 V340 M720 0 V340 M880 0 V340 M1040 0 V340 M1200 0 V340"/>
  </g>

  <!-- left: the .drawio graph -->
  <g transform="translate(90,90)" filter="url(#glow)">
    <rect x="0" y="20" width="120" height="60" rx="12" fill="none" stroke="#3ad0ff" stroke-width="3"/>
    <rect x="0" y="120" width="120" height="60" rx="12" fill="none" stroke="#ff5f6d" stroke-width="3"/>
    <circle cx="230" cy="100" r="34" fill="none" stroke="#ffc371" stroke-width="3"/>
    <path d="M120 50 C 170 50 170 100 196 100" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <path d="M120 150 C 170 150 170 100 196 100" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  </g>

  <!-- arrow -->
  <g transform="translate(430,170)">
    <path d="M0 0 H150" stroke="url(#funk)" stroke-width="10" stroke-linecap="round"/>
    <path d="M140 -16 L172 0 L140 16 Z" fill="#3ad0ff"/>
  </g>

  <!-- right: the framed image -->
  <g transform="translate(650,80)">
    <rect x="0" y="0" width="230" height="180" rx="16" fill="url(#chip)" opacity="0.18"/>
    <rect x="0" y="0" width="230" height="180" rx="16" fill="none" stroke="url(#funk)" stroke-width="4"/>
    <circle cx="55" cy="55" r="20" fill="#ffc371"/>
    <path d="M18 150 L85 88 L128 128 L170 96 L212 150 Z" fill="#3ad0ff"/>
    <text x="115" y="215" text-anchor="middle" fill="#cbd5ff" font-size="18" letter-spacing="4">SVG · PNG · PDF · JPG</text>
  </g>

  <!-- wordmark -->
  <text x="90" y="315" fill="url(#funk)" font-size="30" font-weight="800" letter-spacing="1">drawio-to-images</text>
  <text x="470" y="315" fill="#9fb2ff" font-size="18">render only what actually changed</text>
</svg>
